
name: Update Deadlock Hero Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadlock-data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and process Deadlock API data
        run: python src/run_pipeline.py

      - name: Validate processed data
        run: python -m pytest tests/ -v

      - name: Commit updated dataset
        run: |
          if git diff --quiet -- data/processed/hero_performance.csv; then
            echo "No dataset changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/hero_performance.csv
          git commit -m "Update Deadlock hero statistics"
          git push
