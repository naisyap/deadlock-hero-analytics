
name: Test Deadlock Hero Data Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-data-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and process Deadlock API data
        run: python src/run_pipeline.py

      - name: Validate processed data
        run: python -m pytest tests/ -v

      - name: Confirm pipeline completed
        run: echo "Deadlock pipeline test completed successfully."
